[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-based-autonomous-navigation-system"
version = "0.1.0"
description = "2D autonomous navigation simulator in Python using occupancy grids, A* planning, unicycle kinematics, and proportional control."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Project Author" }
]
dependencies = [
    "numpy",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
